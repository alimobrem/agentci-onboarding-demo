apiVersion: agentci.io/v1alpha1
kind: EvalSuite
metadata:
  id: customer-safety
spec:
  class: golden
  requirements: [REQ-001]
  impact:
    categories: [prompt]
    include: [prompts/**]
  runner:
    adapter: command
    command:
      - node
      - -e
      - "process.exit(0)"
    timeoutMs: 10000
  scenarios:
    - id: safe-response
      critical: true
  trials:
    count: 2
    passRate: 0
    confidenceMethod: wilson
